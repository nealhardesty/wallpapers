name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # audit-history scans every commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make ci
