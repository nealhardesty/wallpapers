name: ci

on:
  push:
    branches: [master]
    tags: ['v*']   # a release: signed APK, extension zip, Mac app and Windows app on a GitHub Release
  pull_request:
  schedule:
    - cron: '23 9 * * *'   # daily, after Bing's new image: refreshes bing.json on Pages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # audit-history scans every commit
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v6   # the Windows app: make ci runs its unit tests (SPEC §10.25.15)
        with:
          dotnet-version: 10.0.x
      - run: make ci
      # Signing (SPEC §10.25.13) only on a tag, and only once the six
      # WALLPAPERS_SIGN_* secrets exist: release.sh verifies a signed exe with
      # osslsigncode. Without them the build is unsigned and says so.
      - name: Install the signature checker (signed releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING: ${{ secrets.WALLPAPERS_SIGN_ENDPOINT != '' }}
        run: |
          if [ "$SIGNING" = true ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
          else
            echo "no WALLPAPERS_SIGN_* secrets: the Windows app ships unsigned"
          fi
      # Cross-compiles the Windows app on Linux on every push, checks it and zips it
      # (SPEC §10.25.15); the win job self-tests that zip and the release job attaches it.
      - run: make win-release
        env:
          WALLPAPERS_SIGN_ENDPOINT: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WALLPAPERS_SIGN_ENDPOINT || '' }}
          WALLPAPERS_SIGN_ACCOUNT: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WALLPAPERS_SIGN_ACCOUNT || '' }}
          WALLPAPERS_SIGN_PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WALLPAPERS_SIGN_PROFILE || '' }}
          WALLPAPERS_SIGN_TENANT: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WALLPAPERS_SIGN_TENANT || '' }}
          WALLPAPERS_SIGN_CLIENT_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WALLPAPERS_SIGN_CLIENT_ID || '' }}
          WALLPAPERS_SIGN_CLIENT_SECRET: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WALLPAPERS_SIGN_CLIENT_SECRET || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: wallpapers-extension
          path: dist/wallpapers-extension-*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: wallpapers-windows
          path: |
            dist/wallpapers-windows-*.zip
            dist/wallpapers-windows-*.zip.sha256

  android:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: make android-build
      - uses: actions/upload-artifact@v7
        with:
          name: wallpapers-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # The Mac app and its screen saver (SPEC §10.21). The hosted macOS runner
  # gives a web view a screen (v0.8.0's first run passed all 41 checks), so the
  # self-tests gate the build. mac-release goes last because the tests build a
  # host-only app into the same folder.
  mac:
    if: github.event_name != 'schedule'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Self-tests
        timeout-minutes: 8
        run: |
          make mac-test
          make mac-saver-test
      - run: make mac-release
      - uses: actions/upload-artifact@v7
        with:
          name: wallpapers-mac
          path: |
            dist/wallpapers-mac-*.zip
            dist/wallpapers-mac-*.zip.sha256

  # The Windows app's self-test (SPEC §10.25.15) against the zip the ci job
  # built on Linux, so what is tested is what ships. Git Bash runs make.
  win:
    needs: ci
    if: github.event_name != 'schedule'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wallpapers-windows
          path: dist
      - name: Make
        run: make --version >/dev/null 2>&1 || choco install make -y --no-progress
      - name: WebView2 runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (-not (Test-Path $key)) {
            Write-Output 'WebView2 runtime missing: installing the Evergreen runtime'
            $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
            Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -Wait
          }
          Write-Output "WebView2 runtime $((Get-ItemProperty $key).pv)"
      - name: Self-test the zip
        run: |
          echo "SELFTEST_DIR=$LOCALAPPDATA\Wallpapers-test" >> "$GITHUB_ENV"
          make win-test-zip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wallpapers-windows-selftest
          path: |
            ${{ env.SELFTEST_DIR }}/selftest.txt
            ${{ env.SELFTEST_DIR }}/log.txt
          if-no-files-found: warn

  # Tag vX.Y.Z (matching web/manifest.json's version) to publish. The
  # keystore lives only in the repo's secrets (SPEC §6.6).
  release:
    needs: [ci, android, mac, win]
    # The Mac build and the Windows self-test are the newest and least proven:
    # if either fails, the Android app and the extension still ship, and a
    # warning says what's missing.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.ci.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the tag matches the version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./web/manifest.json').version")"
      - name: Build the signed APK and the extension
        env:
          KEYSTORE_BASE64: ${{ secrets.WALLPAPERS_KEYSTORE_BASE64 }}
          WALLPAPERS_KEYSTORE_PASSWORD: ${{ secrets.WALLPAPERS_KEYSTORE_PASSWORD }}
          WALLPAPERS_KEY_ALIAS: ${{ secrets.WALLPAPERS_KEY_ALIAS }}
          WALLPAPERS_KEY_PASSWORD: ${{ secrets.WALLPAPERS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # No key yet (README, Releasing): publish the debug build, which
            # sideloads but can't update over another build's install.
            echo "::warning::no WALLPAPERS_KEYSTORE_* secrets: releasing the debug APK"
            make android-build extension
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/wallpapers-${GITHUB_REF_NAME#v}-debug.apk"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            WALLPAPERS_KEYSTORE="$RUNNER_TEMP/release.jks" make android-release extension
          fi
      - name: Fetch the Mac app
        if: needs.mac.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: wallpapers-mac
          path: dist
      - name: Say so if the Mac app is missing
        if: needs.mac.result != 'success'
        run: |
          echo "::warning::the Mac build ${{ needs.mac.result }}; releasing without it"
      # Built and checked by the ci job, self-tested on Windows by the win job.
      - name: Fetch the Windows app
        if: needs.win.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: wallpapers-windows
          path: dist
      - name: Say so if the Windows app is missing
        if: needs.win.result != 'success'
        run: |
          echo "::warning::the Windows self-test ${{ needs.win.result }}; releasing without the Windows app"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/wallpapers-*.apk dist/wallpapers-extension-*.zip dist/wallpapers-mac-*.zip dist/wallpapers-mac-*.zip.sha256 dist/wallpapers-windows-*.zip dist/wallpapers-windows-*.zip.sha256)
          gh release create "$GITHUB_REF_NAME" --generate-notes "${files[@]}"

  pages:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: make site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
      - id: deploy
        uses: actions/deploy-pages@v5
      # The site as people get it: every wallpaper and the player, with real
      # network and Bing. Daily too, through the schedule. Once more after a
      # minute if the CDN was still serving the previous version.
      - name: Smoke the deployed site
        run: sleep 20 && (make smoke-live || (sleep 60 && make smoke-live))
