name: ci

on:
  push:
    branches: [master]
    tags: ['v*']   # a release: signed APK, extension zip and Mac app on a GitHub Release
  pull_request:
  schedule:
    - cron: '23 9 * * *'   # daily, after Bing's new image: refreshes bing.json on Pages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # audit-history scans every commit
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: make ci
      - uses: actions/upload-artifact@v7
        with:
          name: wallpapers-extension
          path: dist/wallpapers-extension-*.zip

  android:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: make android-build
      - uses: actions/upload-artifact@v7
        with:
          name: wallpapers-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # The Mac app and its screen saver (SPEC §10.21). The self-tests need a
  # logged-in screen, which a hosted runner may not give a web view, so they
  # are an experiment (they never fail the build) until a run shows otherwise;
  # what always gates the build is mac-release's own checks. mac-release goes
  # last because the tests build a host-only app into the same folder.
  mac:
    if: github.event_name != 'schedule'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Self-tests (experimental)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          make mac-test
          make mac-saver-test
      - run: make mac-release
      - uses: actions/upload-artifact@v7
        with:
          name: wallpapers-mac
          path: |
            dist/wallpapers-mac-*.zip
            dist/wallpapers-mac-*.zip.sha256

  # Tag vX.Y.Z (matching web/manifest.json's version) to publish. The
  # keystore lives only in the repo's secrets (SPEC §6.6).
  release:
    needs: [ci, android, mac]
    # The Mac build is the newest and least proven: if it fails, the Android
    # app and the extension still ship, and a warning says what's missing.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.ci.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the tag matches the version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./web/manifest.json').version")"
      - name: Build the signed APK and the extension
        env:
          KEYSTORE_BASE64: ${{ secrets.WALLPAPERS_KEYSTORE_BASE64 }}
          WALLPAPERS_KEYSTORE_PASSWORD: ${{ secrets.WALLPAPERS_KEYSTORE_PASSWORD }}
          WALLPAPERS_KEY_ALIAS: ${{ secrets.WALLPAPERS_KEY_ALIAS }}
          WALLPAPERS_KEY_PASSWORD: ${{ secrets.WALLPAPERS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # No key yet (README, Releasing): publish the debug build, which
            # sideloads but can't update over another build's install.
            echo "::warning::no WALLPAPERS_KEYSTORE_* secrets: releasing the debug APK"
            make android-build extension
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/wallpapers-${GITHUB_REF_NAME#v}-debug.apk"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            WALLPAPERS_KEYSTORE="$RUNNER_TEMP/release.jks" make android-release extension
          fi
      - name: Fetch the Mac app
        if: needs.mac.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: wallpapers-mac
          path: dist
      - name: Say so if the Mac app is missing
        if: needs.mac.result != 'success'
        run: |
          echo "::warning::the Mac build ${{ needs.mac.result }}; releasing without it"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/wallpapers-*.apk dist/wallpapers-extension-*.zip dist/wallpapers-mac-*.zip dist/wallpapers-mac-*.zip.sha256)
          gh release create "$GITHUB_REF_NAME" --generate-notes "${files[@]}"

  pages:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: make site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
      - id: deploy
        uses: actions/deploy-pages@v5
      # The site as people get it: every wallpaper and the player, with real
      # network and Bing. Daily too, through the schedule. Once more after a
      # minute if the CDN was still serving the previous version.
      - name: Smoke the deployed site
        run: sleep 20 && (make smoke-live || (sleep 60 && make smoke-live))
