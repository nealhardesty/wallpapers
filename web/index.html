<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Toy animated wallpapers: snow, rain, fireflies, a fish tank, a self-playing 8-bit adventure and more.">
<title>Wallpapers</title>
<!-- The player. Nothing shows but the wallpaper.
       ,      settings
       [ ]    previous / next wallpaper
       f      fullscreen
     URL: ?w=<id> (this load only) · ?panel=open · ?tier=low|medium|high
     See SPEC.md §4. -->
<link rel="stylesheet" href="core/theme.css">
<style>
  iframe.stage {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    transform-origin: 0 0;
    transition: opacity 0.6s ease;
    color-scheme: normal;
  }
  iframe.stage.entering { opacity: 0; }
  #toast {
    position: fixed;
    top: 16px;
    left: 50%;
    z-index: 10;
    transform: translate(-50%, -8px);
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(17, 24, 39, 0.82);
    color: var(--gray-300);
    font-size: 13px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
<script src="core/wp.js"></script>
<script src="wallpapers/catalog.js"></script>
<script src="core/player.js"></script>
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<script>WP.player.start();</script>
</body>
</html>
