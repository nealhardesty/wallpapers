<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The Chrome extension's rules everywhere, so a page that works here works there. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'">
<meta name="description" content="Toy animated wallpapers: snow, rain, fireflies, a fish tank, a self-playing 8-bit adventure and more.">
<title>Wallpapers</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#000000">
<!-- The player. Nothing shows but the wallpaper.
       ,      wallpapers and settings (or hold the top-right corner)
       [ ]    previous / next wallpaper
       f      fullscreen
       ?      all keys
     URL: ?w=<id> (this load only), ?panel=open, ?tier=low|medium|high.
     See SPEC.md §4. -->
<link rel="stylesheet" href="core/theme.css">
<link rel="stylesheet" href="core/panel.css">
<style>
  iframe.stage {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    transition: opacity 0.6s ease;
    color-scheme: normal;
  }
  iframe.stage.entering { opacity: 0; }
  #toast {
    position: fixed;
    top: 16px;
    left: 50%;
    z-index: 10;
    transform: translate(-50%, -8px);
    padding: 6px 14px;
    border-radius: 16px;
    background: rgba(17, 24, 39, 0.82);
    color: var(--gray-300);
    font-size: 13px;
    max-width: calc(100vw - 32px);
    width: max-content;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
  }
  .hud {
    position: fixed;
    top: 8px;
    left: 8px;
    z-index: 10;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.6);
    color: #9ef0b0;
    font: 11px/1.4 ui-monospace, monospace;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
<script src="core/wp.js" defer></script>
<script src="core/perf.js" defer></script>
<script src="wallpapers/catalog.js" defer></script>
<script src="wallpapers/costs.js" defer></script>
<script src="core/settings.js" defer></script>
<script src="core/panel.js" defer></script>
<script src="core/player.js" defer></script>
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<button id="gear" class="gear" type="button" aria-label="Wallpapers and settings (,)">⚙︎</button>
</body>
</html>
